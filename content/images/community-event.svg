<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="commSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="55%" stop-color="#d4eefa"/>
      <stop offset="100%" stop-color="#c8e8b4"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0b8b8"/>
      <stop offset="100%" stop-color="#909898"/>
    </linearGradient>
    <radialGradient id="sunComm" cx="80%" cy="10%" r="35%">
      <stop offset="0%" stop-color="#ffe870" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe870" stop-opacity="0"/>
    </radialGradient>
    <filter id="commShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#1a2a1a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#commSky)"/>
  <rect width="800" height="600" fill="url(#sunComm)"/>

  <!-- Sun -->
  <circle cx="680" cy="60" r="42" fill="#ffe060" opacity="0.8"/>
  <circle cx="680" cy="60" r="55" fill="#ffd040" opacity="0.14"/>

  <!-- Distant buildings / skyline silhouette -->
  <g fill="#6a8a9a" opacity="0.35">
    <rect x="20" y="180" width="40" height="180"/>
    <rect x="25" y="160" width="30" height="20"/>
    <rect x="80" y="200" width="55" height="160"/>
    <rect x="88" y="178" width="38" height="22"/>
    <rect x="152" y="190" width="35" height="170"/>
    <rect x="158" y="172" width="22" height="18"/>
    <rect x="600" y="195" width="50" height="165"/>
    <rect x="608" y="175" width="34" height="20"/>
    <rect x="662" y="178" width="42" height="182"/>
    <rect x="670" y="155" width="26" height="23"/>
    <rect x="716" y="200" width="38" height="160"/>
    <rect x="722" y="182" width="26" height="18"/>
  </g>

  <!-- Trees along path -->
  <g filter="url(#commShadow)">
    <!-- Left trees -->
    <rect x="30" y="280" width="12" height="100" fill="#5a3e28"/>
    <circle cx="36" cy="268" r="32" fill="#2d6e22"/><circle cx="36" cy="252" r="24" fill="#3a8a2e"/>
    <rect x="110" y="290" width="10" height="90" fill="#5a3e28"/>
    <circle cx="115" cy="280" r="28" fill="#2d6e22"/><circle cx="115" cy="265" r="20" fill="#3a8a2e"/>
    <!-- Right trees -->
    <rect x="695" y="275" width="12" height="105" fill="#5a3e28"/>
    <circle cx="701" cy="263" r="32" fill="#2d6e22"/><circle cx="701" cy="248" r="24" fill="#3a8a2e"/>
    <rect x="760" y="288" width="10" height="92" fill="#5a3e28"/>
    <circle cx="765" cy="277" r="27" fill="#2d6e22"/><circle cx="765" cy="263" r="20" fill="#3a8a2e"/>
  </g>

  <!-- Ground / path -->
  <rect x="0" y="360" width="800" height="240" fill="#90b870"/>
  <!-- Road / walking path -->
  <rect x="180" y="360" width="440" height="240" fill="url(#road)" opacity="0.6"/>
  <!-- Road marking -->
  <g stroke="#fff" stroke-width="3" stroke-dasharray="30 20" opacity="0.4">
    <line x1="400" y1="360" x2="400" y2="600"/>
  </g>

  <!-- Pavement edge -->
  <rect x="178" y="358" width="444" height="6" fill="#c8d0d0" opacity="0.7"/>

  <!-- Banner / ribbon -->
  <rect x="140" y="320" width="520" height="44" rx="8" fill="#e83a5e" opacity="0.18"/>
  <rect x="140" y="320" width="520" height="44" rx="8" fill="none" stroke="#e83a5e" stroke-width="2" opacity="0.35"/>
  <text x="400" y="348" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#c0203a" opacity="0.7" letter-spacing="3">WORLD DIABETES DAY WELLNESS WALK</text>

  <!-- Crowd of walkers (silhouettes) -->
  <!-- Front row (closest, largest) -->
  <g filter="url(#commShadow)">
    <!-- Person 1 - walking left stride -->
    <g transform="translate(230,490)">
      <circle cy="-60" r="16" fill="#1a2a1a"/>
      <rect x="-8" cy="-52" width="16" height="45" y="-52" rx="5" fill="#1a2a1a"/>
      <path d="M0,-12 L-14,30 L-6,32 L0,5 L6,32 L14,30 Z" fill="#2a3a4a"/>
      <line x1="-8" y1="-35" x2="-30" y2="-15" stroke="#1a2a1a" stroke-width="9" stroke-linecap="round"/>
      <line x1="8" y1="-35" x2="22" y2="-10" stroke="#1a2a1a" stroke-width="9" stroke-linecap="round"/>
    </g>
    <!-- Person 2 -->
    <g transform="translate(330,490)">
      <circle cy="-60" r="16" fill="#2a1a3a"/>
      <rect x="-8" cy="-52" width="16" height="45" y="-52" rx="5" fill="#2a1a3a"/>
      <path d="M0,-12 L12,32 L6,34 L0,8 L-6,34 L-12,32 Z" fill="#3a2a5a"/>
      <line x1="8" y1="-35" x2="30" y2="-18" stroke="#2a1a3a" stroke-width="9" stroke-linecap="round"/>
      <line x1="-8" y1="-35" x2="-20" y2="-8" stroke="#2a1a3a" stroke-width="9" stroke-linecap="round"/>
    </g>
    <!-- Person 3 (taller - instructor) -->
    <g transform="translate(420,485)">
      <circle cy="-68" r="18" fill="#1a3a1a"/>
      <circle cy="-84" r="9" fill="#1a3a1a"/>
      <rect x="-9" cy="-58" width="18" height="50" y="-58" rx="6" fill="#1a3a1a"/>
      <path d="M0,-10 L-15,36 L-7,38 L0,8 L7,38 L15,36 Z" fill="#1a3a1a"/>
      <line x1="-9" y1="-40" x2="-35" y2="-22" stroke="#1a3a1a" stroke-width="10" stroke-linecap="round"/>
      <line x1="9" y1="-40" x2="30" y2="-14" stroke="#1a3a1a" stroke-width="10" stroke-linecap="round"/>
      <!-- Badge/sign hint -->
      <rect x="25" y="-28" width="28" height="20" rx="3" fill="#e83a5e" opacity="0.5"/>
    </g>
    <!-- Person 4 -->
    <g transform="translate(510,492)">
      <circle cy="-58" r="15" fill="#3a1a1a"/>
      <rect x="-7" cy="-50" width="14" height="42" y="-50" rx="5" fill="#3a1a1a"/>
      <path d="M0,-10 L13,30 L7,32 L0,6 L-7,32 L-13,30 Z" fill="#4a2a2a"/>
      <line x1="7" y1="-32" x2="28" y2="-15" stroke="#3a1a1a" stroke-width="8" stroke-linecap="round"/>
      <line x1="-7" y1="-32" x2="-22" y2="-8" stroke="#3a1a1a" stroke-width="8" stroke-linecap="round"/>
    </g>
    <!-- Person 5 -->
    <g transform="translate(590,490)">
      <circle cy="-60" r="16" fill="#1a2a3a"/>
      <rect x="-8" cy="-52" width="16" height="45" y="-52" rx="5" fill="#1a2a3a"/>
      <path d="M0,-12 L-12,32 L-6,34 L0,6 L6,34 L12,32 Z" fill="#2a3a5a"/>
      <line x1="-8" y1="-35" x2="-28" y2="-18" stroke="#1a2a3a" stroke-width="9" stroke-linecap="round"/>
      <line x1="8" y1="-35" x2="24" y2="-10" stroke="#1a2a3a" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Middle row (smaller) -->
  <g opacity="0.75">
    <g transform="translate(220,445) scale(0.78)">
      <circle cy="-55" r="13" fill="#2a3a2a"/>
      <rect x="-6" y="-48" width="12" height="38" rx="4" fill="#2a3a2a"/>
      <path d="M0,-10 L-10,26 L-5,28 L0,4 L5,28 L10,26 Z" fill="#2a3a2a"/>
    </g>
    <g transform="translate(300,448) scale(0.75)">
      <circle cy="-55" r="13" fill="#3a2a3a"/>
      <rect x="-6" y="-48" width="12" height="38" rx="4" fill="#3a2a3a"/>
      <path d="M0,-10 L10,26 L5,28 L0,4 L-5,28 L-10,26 Z" fill="#3a2a3a"/>
    </g>
    <g transform="translate(390,442) scale(0.8)">
      <circle cy="-58" r="14" fill="#1a2a3a"/>
      <rect x="-7" y="-50" width="14" height="42" rx="5" fill="#1a2a3a"/>
      <path d="M0,-12 L-12,30 L-6,32 L0,5 L6,32 L12,30 Z" fill="#1a2a3a"/>
    </g>
    <g transform="translate(480,445) scale(0.76)">
      <circle cy="-55" r="13" fill="#3a1a2a"/>
      <rect x="-6" y="-48" width="12" height="38" rx="4" fill="#3a1a2a"/>
      <path d="M0,-10 L10,26 L5,28 L0,4 L-5,28 L-10,26 Z" fill="#3a1a2a"/>
    </g>
    <g transform="translate(560,444) scale(0.78)">
      <circle cy="-55" r="13" fill="#2a3a1a"/>
      <rect x="-6" y="-48" width="12" height="38" rx="4" fill="#2a3a1a"/>
      <path d="M0,-10 L-10,26 L-5,28 L0,4 L5,28 L10,26 Z" fill="#2a3a1a"/>
    </g>
    <g transform="translate(640,446) scale(0.77)">
      <circle cy="-55" r="13" fill="#1a1a3a"/>
      <rect x="-6" y="-48" width="12" height="38" rx="4" fill="#1a1a3a"/>
      <path d="M0,-10 L10,26 L5,28 L0,4 L-5,28 L-10,26 Z" fill="#1a1a3a"/>
    </g>
  </g>

  <!-- Far back row (very small) -->
  <g opacity="0.5">
    <g transform="translate(240,410) scale(0.55)"><circle cy="-50" r="11" fill="#2a2a2a"/><rect x="-5" y="-42" width="10" height="34" rx="3" fill="#2a2a2a"/><path d="M0,-8 L-8,22 L-4,23 L0,3 L4,23 L8,22 Z" fill="#2a2a2a"/></g>
    <g transform="translate(310,408) scale(0.52)"><circle cy="-50" r="11" fill="#3a2a2a"/><rect x="-5" y="-42" width="10" height="34" rx="3" fill="#3a2a2a"/><path d="M0,-8 L8,22 L4,23 L0,3 L-4,23 L-8,22 Z" fill="#3a2a2a"/></g>
    <g transform="translate(400,405) scale(0.58)"><circle cy="-52" r="12" fill="#1a2a2a"/><rect x="-6" y="-44" width="12" height="36" rx="4" fill="#1a2a2a"/><path d="M0,-10 L-9,24 L-5,26 L0,4 L5,26 L9,24 Z" fill="#1a2a2a"/></g>
    <g transform="translate(490,407) scale(0.54)"><circle cy="-50" r="11" fill="#2a1a2a"/><rect x="-5" y="-42" width="10" height="34" rx="3" fill="#2a1a2a"/><path d="M0,-8 L8,22 L4,23 L0,3 L-4,23 L-8,22 Z" fill="#2a1a2a"/></g>
    <g transform="translate(570,406) scale(0.55)"><circle cy="-50" r="11" fill="#1a2a1a"/><rect x="-5" y="-42" width="10" height="34" rx="3" fill="#1a2a1a"/><path d="M0,-8 L-8,22 L-4,23 L0,3 L4,23 L8,22 Z" fill="#1a2a1a"/></g>
    <g transform="translate(640,408) scale(0.53)"><circle cy="-50" r="11" fill="#2a2a1a"/><rect x="-5" y="-42" width="10" height="34" rx="3" fill="#2a2a1a"/><path d="M0,-8 L8,22 L4,23 L0,3 L-4,23 L-8,22 Z" fill="#2a2a1a"/></g>
  </g>

  <!-- Health ribbon icon -->
  <g transform="translate(680,430) scale(0.7)">
    <path d="M0,-40 C-20,-55 -40,-35 -20,-10 L0,15 L20,-10 C40,-35 20,-55 0,-40Z" fill="#e83a5e" opacity="0.6"/>
  </g>

  <!-- Clouds -->
  <g fill="#fff" opacity="0.55">
    <ellipse cx="120" cy="70" rx="65" ry="22"/>
    <ellipse cx="170" cy="64" rx="50" ry="19"/>
    <ellipse cx="500" cy="50" rx="75" ry="26"/>
    <ellipse cx="560" cy="44" rx="55" ry="21"/>
  </g>

  <!-- Ground label -->
  <text x="400" y="590" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#3a5a2a" opacity="0.35" letter-spacing="4">WORLD DIABETES DAY · LUCKNOW</text>
</svg>
