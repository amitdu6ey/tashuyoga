<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="40%" stop-color="#d4eaf7"/>
      <stop offset="100%" stop-color="#f0f9e8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dba6e"/>
      <stop offset="100%" stop-color="#4a8a3e"/>
    </linearGradient>
    <linearGradient id="treeTrunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a3e28"/>
      <stop offset="100%" stop-color="#7a5538"/>
    </linearGradient>
    <radialGradient id="sunlight" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#fff9e0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff9e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="treeShadow">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#1a3a0a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="1000" fill="url(#sky2)"/>
  <!-- Morning light rays -->
  <rect width="800" height="1000" fill="url(#sunlight)"/>

  <!-- Sun -->
  <circle cx="130" cy="90" r="55" fill="#ffe080" opacity="0.85"/>
  <circle cx="130" cy="90" r="70" fill="#ffd050" opacity="0.18"/>
  <circle cx="130" cy="90" r="90" fill="#ffbb30" opacity="0.1"/>
  <!-- Sun rays -->
  <g stroke="#ffd050" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <line x1="130" y1="10" x2="130" y2="0"/>
    <line x1="185" y1="35" x2="195" y2="25"/>
    <line x1="210" y1="90" x2="222" y2="90"/>
    <line x1="185" y1="145" x2="195" y2="155"/>
    <line x1="130" y1="170" x2="130" y2="182"/>
    <line x1="75" y1="145" x2="65" y2="155"/>
    <line x1="50" y1="90" x2="38" y2="90"/>
    <line x1="75" y1="35" x2="65" y2="25"/>
  </g>

  <!-- Distant hills / landscape -->
  <ellipse cx="400" cy="520" rx="600" ry="120" fill="#5a9e50" opacity="0.35"/>
  <ellipse cx="700" cy="500" rx="350" ry="100" fill="#4a8a40" opacity="0.3"/>

  <!-- Ground -->
  <rect x="0" y="560" width="800" height="440" fill="url(#ground)"/>
  <!-- Grass texture -->
  <g stroke="#5aaa4a" stroke-width="1.5" opacity="0.4">
    <line x1="50" y1="570" x2="55" y2="558"/><line x1="100" y1="565" x2="104" y2="554"/>
    <line x1="160" y1="572" x2="165" y2="560"/><line x1="220" y1="568" x2="224" y2="556"/>
    <line x1="290" y1="564" x2="293" y2="553"/><line x1="350" y1="570" x2="355" y2="558"/>
    <line x1="420" y1="566" x2="423" y2="555"/><line x1="490" y1="572" x2="494" y2="560"/>
    <line x1="560" y1="567" x2="563" y2="556"/><line x1="630" y1="564" x2="635" y2="552"/>
    <line x1="700" y1="570" x2="704" y2="558"/><line x1="760" y1="566" x2="764" y2="555"/>
  </g>

  <!-- Background trees (left) -->
  <g filter="url(#treeShadow)">
    <rect x="40" y="330" width="22" height="240" fill="url(#treeTrunk)"/>
    <ellipse cx="51" cy="300" rx="55" ry="80" fill="#2d6e22"/>
    <ellipse cx="51" cy="270" rx="40" ry="60" fill="#3a8a2e"/>
    <ellipse cx="51" cy="250" rx="28" ry="45" fill="#4aaa3a"/>
  </g>

  <!-- Background trees (right) -->
  <g filter="url(#treeShadow)">
    <rect x="720" y="310" width="24" height="260" fill="url(#treeTrunk)"/>
    <ellipse cx="732" cy="278" rx="60" ry="85" fill="#2d6e22"/>
    <ellipse cx="732" cy="246" rx="44" ry="65" fill="#3a8a2e"/>
    <ellipse cx="732" cy="224" rx="30" ry="50" fill="#4aaa3a"/>
  </g>
  <!-- Mid background tree -->
  <g opacity="0.7">
    <rect x="590" y="360" width="16" height="200" fill="#5a3e28"/>
    <ellipse cx="598" cy="338" rx="38" ry="55" fill="#2d6e22"/>
    <ellipse cx="598" cy="316" rx="28" ry="42" fill="#3a8a2e"/>
  </g>
  <g opacity="0.7">
    <rect x="170" y="380" width="14" height="180" fill="#5a3e28"/>
    <ellipse cx="177" cy="360" rx="34" ry="50" fill="#2d6e22"/>
    <ellipse cx="177" cy="340" rx="24" ry="38" fill="#3a8a2e"/>
  </g>

  <!-- Yoga mats on ground -->
  <g opacity="0.85">
    <!-- Instructor mat (center) -->
    <ellipse cx="400" cy="730" rx="55" ry="18" fill="#c9a87a" opacity="0.7"/>
    <!-- Student mats -->
    <ellipse cx="200" cy="800" rx="48" ry="15" fill="#8ab4d8" opacity="0.6"/>
    <ellipse cx="600" cy="800" rx="48" ry="15" fill="#c88aa8" opacity="0.6"/>
    <ellipse cx="140" cy="900" rx="45" ry="14" fill="#a8c8a0" opacity="0.6"/>
    <ellipse cx="660" cy="900" rx="45" ry="14" fill="#d8a870" opacity="0.6"/>
    <ellipse cx="350" cy="880" rx="46" ry="14" fill="#a8b8d8" opacity="0.6"/>
    <ellipse cx="500" cy="880" rx="46" ry="14" fill="#d8c8a8" opacity="0.6"/>
  </g>

  <!-- Instructor figure – Warrior II pose (center) -->
  <g fill="#1a2e1a">
    <!-- Back leg -->
    <path d="M400,700 L350,760 L365,762 L410,704Z"/>
    <!-- Front leg bent -->
    <path d="M400,700 L440,755 L428,762 L392,706Z"/>
    <!-- Torso -->
    <rect x="392" y="640" width="16" height="65" rx="6"/>
    <!-- Head -->
    <circle cx="400" cy="625" r="18"/>
    <!-- Left arm extended -->
    <path d="M400,660 L310,645" stroke="#1a2e1a" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Right arm extended -->
    <path d="M400,660 L490,645" stroke="#1a2e1a" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Hair bun -->
    <circle cx="400" cy="609" r="9"/>
  </g>

  <!-- Student figures – Warrior I (seated/standing) -->
  <!-- Student left - seated cross-legged -->
  <g fill="#2a3a2a" opacity="0.82">
    <path d="M200,790 C175,780 155,768 148,758 C165,748 185,752 200,762 L200,762 C215,752 235,748 252,758 C245,768 225,780 200,790Z"/>
    <rect x="193" y="745" width="14" height="50" rx="5"/>
    <circle cx="200" cy="730" r="15"/>
    <circle cx="200" cy="718" r="7"/>
    <path d="M200,768 L160,758" stroke="#2a3a2a" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M200,768 L240,758" stroke="#2a3a2a" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Student right - standing warrior -->
  <g fill="#2a3a2a" opacity="0.82">
    <path d="M600,790 C575,780 555,768 548,758 C565,748 585,752 600,762 C615,752 635,748 652,758 C645,768 625,780 600,790Z"/>
    <rect x="593" y="745" width="14" height="50" rx="5"/>
    <circle cx="600" cy="730" r="15"/>
    <circle cx="600" cy="718" r="7"/>
    <path d="M600,768 L560,758" stroke="#2a3a2a" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M600,768 L640,758" stroke="#2a3a2a" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Flowers / nature elements on ground -->
  <g>
    <circle cx="80" cy="565" r="5" fill="#ff9ec0" opacity="0.7"/>
    <circle cx="720" cy="568" r="4" fill="#ffcc80" opacity="0.7"/>
    <circle cx="300" cy="570" r="3" fill="#ff9ec0" opacity="0.6"/>
    <circle cx="480" cy="566" r="4" fill="#ffd08a" opacity="0.65"/>
    <circle cx="650" cy="572" r="3.5" fill="#b0e890" opacity="0.7"/>
  </g>

  <!-- Light beam from sun -->
  <polygon points="130,140 20,560 80,560" fill="#fffbe0" opacity="0.07"/>
  <polygon points="130,140 100,560 160,560" fill="#fffbe0" opacity="0.06"/>

  <!-- RYT-500 badge watermark -->
  <g transform="translate(640,60)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#7dba6e" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="40" fill="#fff" opacity="0.12"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#3a7a2a" font-weight="bold" opacity="0.8">RYT-500</text>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#3a7a2a" opacity="0.7">CERTIFIED</text>
  </g>
</svg>
